name: Тесты бэкенда

on:
  push:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-tests.yml"

concurrency:
  group: backend-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Тот же Postgres, что в deploy/docker-compose.yml
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rebook
          POSTGRES_PASSWORD: rebook_dev
          POSTGRES_DB: rebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rebook -d rebook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      # одноразовая база раннера, не секрет; conftest пересоздаёт схему сам
      DATABASE_URL: postgresql+psycopg://rebook:rebook_dev@127.0.0.1:5432/rebook_test
      DATABASE_URL_TEST: postgresql+psycopg://rebook:rebook_dev@127.0.0.1:5432/rebook_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest
        run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest.log
      # логи Actions видны только после входа — упавшие тесты выносим в аннотации PR
      - name: Упавшие тесты
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | head -10 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
