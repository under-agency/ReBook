# Бот заявок — отдельный маленький контейнер.
# На общем сервере мало памяти, поэтому жёсткий лимит.
#   cp .env.example .env && nano .env && docker compose up -d --build
name: rebook-leads

services:
  lead-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
